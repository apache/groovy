groovyVersion=6.0.0-SNAPSHOT
# bundle version format: major('.'minor('.'micro('.'qualifier)?)?)? (first 3 only digits)
groovyBundleVersion=6.0.0.SNAPSHOT

groovyTargetBytecodeVersion=17
targetJavaVersion=17

binaryCompatibilityBaseline=versions.latest5
gradle_version=9.7.1
# SHA-256 of the gradle_version distribution named by distributionUrl, from
# https://gradle.org/release-checksums (take "Binary-only (-bin) ZIP Checksum").
# When set, `gradle -p bootstrap` writes it into gradle-wrapper.properties as
# distributionSha256Sum and the wrapper verifies the distribution it downloads
# instead of trusting the URL. Update it in the same edit as gradle_version:
# a stale value fails the next build with a checksum mismatch, which is the
# intended behaviour, not a bug. Leave unset to generate a wrapper without the
# check.
gradle_distribution_sha256=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a

groovyJUnit_ms=512m
groovyJUnit_mx=2g
groovyJUnit_permSize=64m
groovyJUnit_maxPermSize=256m

javacMain_mx=512m
groovycMain_mx=1g
groovycTest_mx=1g

javaDoc_mx=1g

# adjust if needed for different jdk versions
#org.gradle.jvmargs=-ea -Xmx1500m
org.gradle.jvmargs=-Xms1200m -Xmx2g -XX:MaxMetaspaceSize=1500m -XX:+UseG1GC

# enable the Gradle build cache
org.gradle.caching=true

# enable --parallel
org.gradle.parallel=true

# prefer jars over class folders on the compile classpath
org.gradle.java.compile-classpath-packaging=true

# make dependency-verification lenient
org.gradle.dependency.verification=lenient

# log stacktrace (use 'all' for debugging Gradle issues, 'internal' for normal use)
org.gradle.logging.stacktrace=internal
