import org.apache.groovy.gradle.ConcurrentExecutionControlBuildService
import org.apache.groovy.gradle.SharedConfiguration

plugins {
    id 'groovy'
    id 'org.apache.groovy-common'
    id 'org.apache.groovy-internal'
}

dependencies {
    implementation project(':')
    testImplementation projects.groovyTest
}

tasks.withType(Test).configureEach {
    // Same as groovy-performance: this module is not groovy-tested, so it
    // would otherwise sit outside the global Test cap with an ergonomic heap.
    minHeapSize = '64m'
    maxHeapSize = '512m'
    jvmArgs "-XX:ActiveProcessorCount=${sharedConfiguration.testActiveProcessorCount}"
    usesService(ConcurrentExecutionControlBuildService.restrict(Test, gradle,
        SharedConfiguration.TEST_MAX_CONCURRENT_TASKS))
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_14)) {
        // Append, same as the original `jvmArgs +=`. JavaForkOptions.jvmArgs()
        // adds; do not use setJvmArgs / `jvmArgs =`, which would drop APC above.
        jvmArgs '--enable-preview'
    }
}

sourceSets {
    test {
        groovy {
            if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_14)) {
                exclude '**/vm14/*'
            }
        }
    }
}
