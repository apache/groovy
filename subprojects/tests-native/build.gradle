// Native-image parity for Groovy's own runtime (GROOVY-12365).
//
// The groovy jar ships GraalVM reachability metadata for what the runtime does
// on its own behalf (generated by NativeImageMetadataGenerator). This project
// checks that promise against a dynamic probe program:
//
//   nativeAgentRun        runs the probe on the GraalVM JVM under the native-image
//                         agent, recording only what Groovy's own classes do
//   checkNativeMetadata   fails if the recording names a Groovy-owned type or member
//                         the jar's metadata does not cover
//   nativeRun             builds the probe into an image with nothing but the jar's
//                         metadata for Groovy's part and runs it (default mode)
//   nativeRunExact        the same under --exact-reachability-metadata
//   nativeCheck           all of the above
//   updateProbeMetadata   rewrites the probe's own metadata file from an unfiltered
//                         recording, after the probe changes
//
// The boundary: the jar covers what the runtime does on its own behalf (its
// bootstrap and dispatch machinery). What a program touches dynamically, JDK
// classes and Groovy API classes alike, is the program's to record, and the
// probe's own metadata file holds that for the probe. The drift check therefore
// treats anything in the probe's file as application-driven; updateProbeMetadata
// prints the Groovy-owned entries it keeps so a reviewer can tell API use from
// a runtime gap, which belongs in the generator instead.
//
// Everything needs a GraalVM: pass -Pgroovy.native.home=<GraalVM home> or set
// GRAALVM_HOME. Without one the tasks are skipped, so the ordinary build is
// unaffected. Run this on its own: an image build and the core test suite
// together exhaust the memory of a developer machine.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'groovy'
    id 'org.apache.groovy-common'
    id 'org.apache.groovy-internal'
}

dependencies {
    implementation project(':')
}

def graalvmHome = providers.gradleProperty('groovy.native.home')
        .orElse(providers.environmentVariable('GRAALVM_HOME'))
def graalvmPresent = graalvmHome.map { new File(it, 'bin/native-image').exists() || new File(it, 'bin/native-image.cmd').exists() }.orElse(false)
def graalvmBin = { String tool -> graalvmHome.map { "$it/bin/$tool" as String } }

// what a Java user of org.apache.groovy:groovy gets: the repackaged jar, not the classes directory
def coreJar = rootProject.tasks.named('repackageJar').flatMap { it.archiveFile }
def probeClasspath = files(coreJar, sourceSets.main.output)
def nativeDir = layout.buildDirectory.dir('native')
def agentDir = nativeDir.map { it.dir('agent') }
def agentAllDir = nativeDir.map { it.dir('agent-all') }
def callerFilter = layout.projectDirectory.file('src/native/caller-filter.json')
def probeMetadata = layout.projectDirectory.file('src/main/resources/META-INF/native-image/org.apache.groovy/tests-native/reachability-metadata.json')

def groovyPackages = ['groovy.', 'org.codehaus.groovy.', 'org.apache.groovy.']
def groovyOwned = { String type -> groovyPackages.any { type.startsWith(it) } }

// Names the runtime looks up with a constant string, which the image builder
// folds: the agent records them, the jar need not ship them.
def foldedLookups = ['groovy.runtime.metaclass.CustomMetaClassCreationHandle'] as Set

tasks.withType(Exec).configureEach {
    onlyIf('a GraalVM is configured (-Pgroovy.native.home or GRAALVM_HOME)') { graalvmPresent.get() }
}

def registerAgentRun = { String name, Provider<Directory> outputDir, boolean filtered ->
    tasks.register(name, Exec) {
        group = 'verification'
        description = "Runs the probe on the GraalVM JVM under the native-image agent${filtered ? ', recording Groovy callers only' : ''}"
        dependsOn rootProject.tasks.named('repackageJar'), classes
        inputs.files(probeClasspath)
        if (filtered) inputs.file(callerFilter)
        outputs.dir(outputDir)
        doFirst {
            delete(outputDir)
            def agent = "-agentlib:native-image-agent=config-output-dir=${outputDir.get().asFile}" +
                    (filtered ? ",caller-filter-file=${callerFilter.asFile}" : '')
            commandLine graalvmBin('java').get(), agent, '-cp', probeClasspath.asPath, 'probe'
        }
        standardOutput = new ByteArrayOutputStream()
    }
}
def nativeAgentRun = registerAgentRun('nativeAgentRun', agentDir, true)
def nativeAgentRunAll = registerAgentRun('nativeAgentRunAll', agentAllDir, false)

// whether a shipped entry's flags and method list satisfy one recorded need
def covers = { Map flags, String need, Map recorded ->
    switch (need) {
        case 'methods':
            if (flags.allDeclaredMethods || flags.allPublicMethods) return true
            def listed = (flags.methods ?: []).collect { [it.name, it.parameterTypes] }
            return recorded.methods.every { [it.name, it.parameterTypes] in listed }
        case 'fields':
            return flags.allDeclaredFields || (flags.fields ?: [])*.name.containsAll(recorded.fields*.name)
        default:
            return flags[need]
    }
}

// the type a naming-convention lookup was made for, or null for an ordinary type
def negativeBase = { String t ->
    t.endsWith('BeanInfo') ? t[0..<-8] : t.endsWith('Customizer') ? t[0..<-10] :
    (t.startsWith('groovy.runtime.metaclass.') && t.endsWith('MetaClass')) ? t.substring(25)[0..<-9] : null
}

def metadataByType = { File json ->
    def byType = [:].withDefault { [:] }
    new JsonSlurper().parse(json).reflection.each { Map e ->
        if (!(e.type instanceof String)) return
        def merged = byType[e.type as String]
        e.each { k, v -> if (!(k in ['type', 'condition'])) merged[k] = (k == 'methods' && merged[k]) ? merged[k] + v : v }
    }
    byType
}

def shippedMetadata = { File jar ->
    metadataByType(zipTree(jar).matching { include 'META-INF/native-image/org.apache.groovy/groovy/reachability-metadata.json' }.singleFile)
}

def checkNativeMetadata = tasks.register('checkNativeMetadata') {
    group = 'verification'
    description = 'Fails if the agent recorded a Groovy-owned reflective need the jar does not ship metadata for'
    dependsOn nativeAgentRun
    onlyIf('a GraalVM is configured (-Pgroovy.native.home or GRAALVM_HOME)') { graalvmPresent.get() }
    inputs.files(coreJar)
    inputs.dir(agentDir)
    doLast {
        def recorded = new JsonSlurper().parse(agentDir.get().file('reachability-metadata.json').asFile).reflection
        def shipped = shippedMetadata(coreJar.get().asFile)
        def probeOwn = metadataByType(probeMetadata.asFile)
        def missing = []
        recorded.each { Map e ->
            def type = e.type
            if (!(type instanceof String) || type in foldedLookups) return
            if (probeOwn.containsKey(type) && (e.keySet() - ['type', 'condition']).every { covers(probeOwn[type], it, e) }) return
            def base = negativeBase(type)
            if (base != null) {
                // a lookup by naming convention: Groovy's business when the probed type is Groovy's
                if (groovyOwned(base) && !shipped.containsKey(type)) missing << "$type (negative lookup)"
                return
            }
            if (!groovyOwned(type)) return // the application's, or the JDK's: the exact-mode image is the check for those
            def flags = shipped[type]
            if (!shipped.containsKey(type)) { missing << "$type (not shipped at all)"; return }
            (e.keySet() - ['type', 'condition']).each { String need ->
                if (!covers(flags, need, e)) missing << "$type $need${need == 'methods' ? ' ' + e.methods*.name : ''}"
            }
        }
        if (missing) {
            throw new GradleException("The runtime needs reflection metadata the groovy jar does not ship; " +
                    "extend NativeImageMetadataGenerator for:\n  " + missing.join('\n  '))
        }
        logger.lifecycle("checkNativeMetadata: ${recorded.size()} recorded entries, every Groovy-owned one is shipped")
    }
}

def registerImage = { String suffix, boolean exact ->
    def image = nativeDir.map { it.file("probe$suffix") }
    def compile = tasks.register("nativeCompile$suffix", Exec) {
        group = 'verification'
        description = "Builds the probe into a native image${exact ? ' with --exact-reachability-metadata' : ''}, with only the jar's metadata for Groovy's part"
        dependsOn rootProject.tasks.named('repackageJar'), classes
        inputs.files(probeClasspath)
        outputs.file(image)
        doFirst {
            def args = [graalvmBin('native-image').get()]
            if (exact) args << '--exact-reachability-metadata'
            args.addAll(['-cp', probeClasspath.asPath, '-o', image.get().asFile.path, 'probe'])
            commandLine args
        }
    }
    tasks.register("nativeRun$suffix", Exec) {
        group = 'verification'
        description = "Runs the ${exact ? 'strict' : 'default'}-mode probe image and checks its marker"
        dependsOn compile
        inputs.file(image)
        def output = new ByteArrayOutputStream()
        standardOutput = output
        errorOutput = output
        ignoreExitValue = true
        doFirst { commandLine image.get().asFile.path }
        doLast {
            def text = output.toString()
            if (executionResult.get().exitValue != 0 || !text.contains('PROBE OK')) {
                throw new GradleException("the ${exact ? 'strict' : 'default'}-mode probe image failed:\n$text")
            }
            logger.lifecycle("nativeRun$suffix: PROBE OK")
        }
    }
}
def nativeRun = registerImage('', false)
def nativeRunExact = registerImage('Exact', true)

tasks.register('nativeCheck') {
    group = 'verification'
    description = 'Checks the shipped reachability metadata against the probe: agent drift check plus both images'
    dependsOn checkNativeMetadata, nativeRun, nativeRunExact
}

tasks.register('updateProbeMetadata') {
    group = 'other'
    description = "Rewrites the probe's own reachability metadata from an unfiltered agent recording, leaving out what Groovy's runtime accounts for"
    dependsOn nativeAgentRunAll
    onlyIf('a GraalVM is configured (-Pgroovy.native.home or GRAALVM_HOME)') { graalvmPresent.get() }
    doLast {
        def recorded = new JsonSlurper().parse(agentAllDir.get().file('reachability-metadata.json').asFile).reflection
        def shipped = shippedMetadata(coreJar.get().asFile)
        // dynamic proxies the agent does not see: a closure coerced to a SAM parameter at a dynamic
        // call site is proxied through a method handle the agent does not instrument, so the
        // interfaces recorded here by hand are carried over from the current file
        def proxies = probeMetadata.asFile.exists() ?
                new JsonSlurper().parse(probeMetadata.asFile).reflection.findAll { !(it.type instanceof String) } : []
        recorded = recorded + proxies.findAll { p -> !recorded.any { it.type == p.type } }
        def keep = recorded.findAll { Map e ->
            def type = e.type
            if (!(type instanceof String)) return true // a dynamic proxy: which interfaces are coerced is the application's
            if (type in foldedLookups) return false
            if (!shipped.containsKey(type)) return true
            !(e.keySet() - ['type', 'condition']).every { covers(shipped[type], it, e) }
        }.collect { Map e -> e.findAll { k, v -> k != 'condition' } }
        probeMetadata.asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([reflection: keep])) + '\n'
        logger.lifecycle("updateProbeMetadata: ${keep.size()} application-side entries written to ${probeMetadata.asFile}")
        def groovyApi = keep.findAll { it.type instanceof String && groovyOwned(negativeBase(it.type as String) ?: it.type as String) }
        if (groovyApi) {
            logger.lifecycle("updateProbeMetadata: kept as the probe's own use of Groovy API classes (a runtime-internal need would belong in NativeImageMetadataGenerator instead):\n  " +
                    groovyApi.collect { it.type }.sort().join('\n  '))
        }
    }
}
