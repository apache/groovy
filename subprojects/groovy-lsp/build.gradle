plugins {
    id 'org.apache.groovy-library'
}

dependencies {
    implementation project(':')
    // Public server methods use these types, so embedders such as the
    // console can compile against the same API a remote client speaks.
    api "org.eclipse.lsp4j:org.eclipse.lsp4j:${versions.lsp4j}"
    api "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:${versions.lsp4j}"
    testImplementation projects.groovyTest
}

groovyLibrary {
    optionalModule()
    withoutBinaryCompatibilityChecks()
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': 'org.apache.groovy.lsp.GroovyLanguageServerLauncher')
    }
}

tasks.named('rat') {
    excludes += [
            'src/test/resources/**'
    ]
}
