# Native-image parity for Groovy's own runtime (GROOVY-12365).
#
# The groovy jar ships GraalVM reachability metadata generated by the build.
# This workflow runs subprojects/tests-native, which records what the runtime
# does under the native-image agent, fails on anything Groovy-owned the jar
# does not cover, and builds and runs a dynamic probe as an image, in default
# and strict reachability modes, with nothing but the jar's metadata for
# Groovy's part.
#
# It runs when the runtime's reflective surface or the probe changes, weekly
# to catch what slips past the path filter, and on demand. The generator's
# own unit test needs no GraalVM and runs in the ordinary test workflow.
# The image build is memory-hungry, so this job runs nothing else.
#
# GraalVM for JDK 25.0.4 or later is required. Earlier releases carry a
# built-in Groovy substitution that targets a method Groovy 6 no longer has,
# so native-image fails before it reads any metadata, and their agent writes
# the legacy split configuration files rather than reachability-metadata.json.

name: "Native Image Metadata Check"

on:
  push:
    branches: [master]
    paths:
      - 'src/main/java/org/codehaus/groovy/reflection/**'
      - 'src/main/java/org/codehaus/groovy/runtime/**'
      - 'src/main/java/org/codehaus/groovy/vmplugin/**'
      - 'src/main/java/org/codehaus/groovy/tools/DgmConverter.java'
      - 'src/main/java/org/codehaus/groovy/tools/NativeImageMetadataGenerator.java'
      - 'src/main/java/org/apache/groovy/runtime/**'
      - 'src/main/java/groovy/lang/**'
      - 'src/resources/META-INF/native-image/**'
      - 'subprojects/tests-native/**'
      - 'subprojects/groovy-nio/src/main/**'
      - 'subprojects/groovy-xml/src/main/**'
      - 'subprojects/groovy-json/src/main/**'
      - '.github/workflows/groovy-native-check.yml'
  pull_request:
    paths:
      - 'src/main/java/org/codehaus/groovy/reflection/**'
      - 'src/main/java/org/codehaus/groovy/runtime/**'
      - 'src/main/java/org/codehaus/groovy/vmplugin/**'
      - 'src/main/java/org/codehaus/groovy/tools/DgmConverter.java'
      - 'src/main/java/org/codehaus/groovy/tools/NativeImageMetadataGenerator.java'
      - 'src/main/java/org/apache/groovy/runtime/**'
      - 'src/main/java/groovy/lang/**'
      - 'src/resources/META-INF/native-image/**'
      - 'subprojects/tests-native/**'
      - 'subprojects/groovy-nio/src/main/**'
      - 'subprojects/groovy-xml/src/main/**'
      - 'subprojects/groovy-json/src/main/**'
      - '.github/workflows/groovy-native-check.yml'
  schedule:
    - cron: '0 5 * * 1'  # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The GraalVM action, on the ASF approved list, bundles native-image and
      # the agent and exports GRAALVM_HOME. `version` selects the release train:
      # GraalVM renamed its builds from jdk-25.0.x to graal-25.x in 2026, and
      # with `java-version` alone (or with setup-java) the resolution stops at
      # the January jdk-25.0.2 build, which predates the fix Groovy 6 needs.
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: GraalVM versions
        run: |
          java --version
          native-image --version
          # the substitution fix and the combined metadata format need 25.0.4 or later
          native-image --version | grep -qE 'native-image (25\.([1-9]|0\.([4-9]|[1-9][0-9]))|2[6-9]\.|[3-9][0-9]\.)' \
            || { echo "GraalVM for JDK 25.0.4 or later is required" >&2; exit 1; }
      # Restore-only (never saves): this job resolves a subset of the `build`
      # lineage; see groovy-build-test.yml (lts job) for the caching rationale.
      - name: "🗄 Restore Gradle dependencies (~/.gradle/caches/modules-2 + wrapper)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-${{ hashFiles('versions.properties', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle', 'build-logic/build.gradle') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # The action's own caching is disabled: dependency jars and wrapper
        # dists are cached by the explicit branch-keyed step above instead.
        with:
          cache-disabled: true
      - name: Native image metadata check
        run: ./gradlew :tests-native:nativeCheck -Pgroovy.native.home=$GRAALVM_HOME --no-daemon --no-scan
        timeout-minutes: 30
