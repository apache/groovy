# The lint gate: the small set of Checkstyle and CodeNarc rules that must
# hold. The full, advisory runs of both tools stay in the main build and only
# produce reports; this job fails on any violation of the gate rules in
# config/checkstyle/gate.xml and config/codenarc/gate.groovy.

name: Lint gate

on:
  push:
    branches:
      - master
      - GROOVY_*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: 21
          check-latest: true
      # Restore-only (never saves): see groovy-rat-check.yml for the reason a
      # job that resolves only part of the build lineage must not save.
      - name: "🗄 Restore Gradle dependencies (~/.gradle/caches/modules-2 + wrapper)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-${{ hashFiles('versions.properties', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle', 'build-logic/build.gradle') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Run the lint gate
        # --continue so that both tools report before the job fails
        run: ./gradlew lintGate --continue
        timeout-minutes: 60
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-gate-reports
          path: |
            **/build/reports/checkstyle/checkstyleGate.xml
            **/build/reports/codenarc/gate.txt
          if-no-files-found: ignore
