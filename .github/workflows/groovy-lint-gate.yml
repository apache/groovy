# The lint gate: the small set of Checkstyle and CodeNarc rules that must
# hold. The full, advisory runs of both tools stay in the main build and only
# produce reports; this job fails on any violation of the gate rules in
# config/checkstyle/gate.xml and config/codenarc/gate.groovy.

name: Lint gate

on:
  push:
    branches:
      - master
      - GROOVY_*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21
          check-latest: true
      # Restore-only (never saves): see groovy-rat-check.yml for the reason a
      # job that resolves only part of the build lineage must not save.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # On Windows setup-gradle may set GRADLE_USER_HOME=D:\a\.gradle, so
      # caching ~/.gradle never hits and the save fails path validation.
      - name: "🗄 Restore Gradle dependencies (GRADLE_USER_HOME modules-2 + wrapper)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-${{ hashFiles('versions.properties', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle', 'build-logic/build.gradle') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-build-${{ github.base_ref || github.ref_name }}-
      - name: Run the lint gate
        # --continue so that both tools report before the job fails
        run: ./gradlew lintGate --continue
        timeout-minutes: 60
      - name: "🛑 Stop Gradle daemon before cache save"
        if: always()
        continue-on-error: true
        run: ./gradlew --stop
      - name: "🧹 Scrub Gradle cache lock files before save"
        if: always()
        shell: bash
        run: |
          dir="${GRADLE_USER_HOME:-$HOME/.gradle}/caches"
          [ -d "$dir" ] || { echo "No $dir — nothing to scrub."; exit 0; }
          deleted=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "lock: $f"
            rm -f "$f"
            deleted=$((deleted + 1))
          done < <(find "$dir" -name '*.lock' 2>/dev/null)
          echo "Scrubbed $deleted Gradle cache lock file(s) before cache save."
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-gate-reports
          path: |
            **/build/reports/checkstyle/checkstyleGate.xml
            **/build/reports/codenarc/gate.txt
          if-no-files-found: ignore
