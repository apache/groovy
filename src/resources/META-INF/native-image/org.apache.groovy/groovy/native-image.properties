# GraalVM native-image picks this file up from the class path (GROOVY-12366).
#
# The classes below keep run-time state or read system properties in their
# static initialisers and decide how dynamic dispatch links (the AOT link mode
# of GROOVY-12234 detects a native image at run time). They must never be
# initialised while the image is being built, even if the builder's class
# initialisation simulation would otherwise consider them safe.
#
# The reflection metadata for Groovy's own runtime is in
# reachability-metadata.json next to this file, generated by the build
# (NativeImageMetadataGenerator, GROOVY-12365): what the metaclass registry and
# the invokedynamic machinery reflect over as they start, the members of the
# Groovy-owned types that get a metaclass, and the BeanInfo, Customizer and
# custom-metaclass names probed for. Reflection over the application's classes
# and the JDK types it uses dynamically, dynamic proxies for coerced closures and
# serialization depend on the application and are recorded with the
# native-image agent as usual.
#
# The generated DGM adapters (org.codehaus.groovy.runtime.dgm$N) need no
# metadata: DgmProxyFactory constructs them directly, so static analysis reaches
# every one of them and all of them are in the image. DgmProxyFactoryConfig is
# initialised at build time so that groovy.dgm.factory becomes a build-time
# constant: pass -Dgroovy.dgm.factory=false to native-image, after an agent run,
# for an image that holds only the adapters the agent recorded (see the
# invokedynamic documentation). The resource patterns Groovy needs are in
# resource-config.json next to this file.
#
# Caller location in java.util.logging inside a native image needs the
# packages Groovy and GraalVM insert to be listed in jdk.logger.packages at
# image build time; that property is a single value, so it is deliberately
# left to the application (see the invokedynamic documentation).
Args = --initialize-at-build-time=org.codehaus.groovy.reflection.DgmProxyFactoryConfig \
       --initialize-at-run-time=org.codehaus.groovy.vmplugin.v8.IndyInterface,org.codehaus.groovy.vmplugin.v8.CacheableCallSite,org.apache.groovy.runtime.indy.AotDispatch,org.apache.groovy.runtime.indy.IndyInvalidation,org.apache.groovy.util.HiddenClassDefiner,org.apache.groovy.internal.runtime.invoke.InvokerFactory,org.codehaus.groovy.control.XStreamUtils
